name: Frontend Vue3 CI/CD Pipeline
on:
  push:
    branches: [main, dev] # 你实际部署分支，可改成master
  # 可开启pull_request做测试
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1 # 和你的ACM、EKS、ECR同一个region
  ECR_REPOSITORY: hy-frontend-repo # 你的ECR仓库名称
  EKS_CLUSTER_DEV: eks-demo # ⚠️替换成你的EKS集群名字
  EKS_CLUSTER_QA: eks-demo # ⚠️替换成你的EKS集群名字
  EKS_CLUSTER_PROD: eks-prod # ⚠️替换成你的EKS集群名字
  NAMESPACE_DEV: dev # 和ingress/service/deployment同一个namespace
  NAMESPACE_QA: qa # 和ingress/service/deployment同一个namespace
  NAMESPACE_PROD: prod # 和ingress/service/deployment同一个namespace
  IMAGE_TAG: ${{ github.sha }} # 使用git commit sha作为镜像tag，便于追溯

jobs:
  # =================== job1：构建镜像，所有分支都会执行 ===================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Build Vue Project
        run: |
          pnpm install
          pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 输出镜像registry给下游部署job使用
      - name: Export registry output
        id: export-registry
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT

      - name: Build & Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }} -f deploy/docker/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}
    outputs:
      ECR_REGISTRY: ${{ steps.export-registry.outputs.ECR_REGISTRY }}
      IMAGE_TAG: ${{ env.IMAGE_TAG }}

  # =================== job2：部署DEV环境：dev分支触发，无需审批 ===================
  dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev # github environment，dev环境不设置审批人，自动执行
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_DEV }} --region ${{ env.AWS_REGION }}

      - name: Deploy to dev overlay
        env:
          ECR_REGISTRY: ${{ needs.build.outputs.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
        run: |
          cd deploy/k8s/overlays/dev
          kustomize build .
          kustomize edit set image frontend-img=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/hy-frontend -n ${{ env.NAMESPACE_DEV }}
          git checkout kustomization.yaml

  # =================== job3：部署QA环境：需要人工approve，dev分支构建完成后等待审批 ===================
  qa:
    needs: dev
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: qa # qa环境配置required‑reviewers，流水线在这里暂停等待人审批
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_QA }} --region ${{ env.AWS_REGION }}

      - name: Deploy to qa overlay
        env:
          ECR_REGISTRY: ${{ needs.build.outputs.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
        run: |
          kubectl kustomize deploy/k8s/overlays/qa \
            --image FRONTEND_IMAGE_ADDR=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG} \
            | kubectl apply -f -
          kubectl rollout status deployment/hy-frontend -n ${{ env.NAMESPACE_QA }}

  # =================== job4：部署PROD环境：main分支触发，人工审批 ===================
  prod:
    needs: qa
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod # prod环境开启人工审批
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_PROD }} --region ${{ env.AWS_REGION }}

      - name: Deploy to prod overlay
        env:
          ECR_REGISTRY: ${{ needs.build.outputs.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
        run: |
          kubectl kustomize deploy/k8s/overlays/prod \
            --image FRONTEND_IMAGE_ADDR=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG} \
            | kubectl apply -f -

          kubectl rollout status deployment/hy-frontend -n ${{ env.NAMESPACE_PROD }}
