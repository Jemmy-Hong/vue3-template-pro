# ingress.yaml
# 适用前提：EKS集群已部署 AWS Load Balancer Controller（ALB Ingress控制器）
# ⚠️ 如果集群是nginx‑ingress控制器，这份yaml不能用，要重写一套nginx‑ingress的ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hy-frontend-ingress # 👈 统一用hy-前缀
  namespace: dev # 和service、deployment保持namespace一致
  labels:
    app.kubernetes.io/name: hy-frontend # 👈 统一
    app.kubernetes.io/component: frontend
  annotations:
    # --------------------------
    # ALB公共基础配置（所有环境dev/qa/prod共用）
    # --------------------------
    # internet-facing=公网ALB，对外给互联网用户访问；内部业务改成 internal
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ALB使用哪些子网；大部分集群会自动发现子网，少数企业集群必须手动指定
    #    alb.ingress.kubernetes.io/subnets: subnet-xxxx,subnet-xxxx
    # 监听端口：同时开启HTTP80、HTTPS443
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    # HTTP 80 请求强制重定向跳转到 HTTPS 443，生产环境建议打开
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # 健康检查配置：ALB会访问pod做健康检查，前端nginx用GET /
    alb.ingress.kubernetes.io/healthcheck-path: "/" # ALB健康检查访问路径
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP # 健康检查协议
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10" # 健康检查间隔10秒
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5" # 健康检查超时时间
    alb.ingress.kubernetes.io/success-codes: "200" # 判定健康的返回码
    alb.ingress.kubernetes.io/healthy-threshold-count: "2" # 连续2次成功判定为健康
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2" # 连续2次失败判定不健康
    # 可选：自定义ALB安全组；不写会自动创建，企业合规环境经常需要指定已有安全组
    # alb.ingress.kubernetes.io/security-groups: sg-xxxx
    # ALB目标类型：ip=pod，instance=节点；EKS集群推荐ip
    alb.ingress.kubernetes.io/target-type: ip

spec:
  # ✅新版推荐，替代废弃的 kubernetes.io/ingress.class: "alb"
  ingressClassName: my-aws-ingress-class # 固定ALB ingress class名称
  # ⚠️ base这里不写 spec.rules！域名和路由交给overlay补丁文件单独维护
