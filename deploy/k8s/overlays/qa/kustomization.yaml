apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 继承base基础模板
resources:
  - ../../base

namespace: qa # kustomize会把所有资源自动注入这个namespace, 真实情况需要改动，首先考察是多集群/单集群多个namespace。

# qa副本数
replicas:
  - name: hy-portal-site
    count: 1

# 给资源打上环境标签 qa
labels:
  - includeTemplates: true
    pairs:
      environment: qa

# 策略合并补丁：注入当前环境spec.rules域名路由（处理rules数组，避免数组下标坑）
patchesStrategicMerge:
  - patch.yaml
