# 指定运行nginx进程的系统用户，nginx镜像默认自带nginx用户，不要改成root
user  nginx;

# worker进程数量，auto自动读取容器CPU核心数，容器环境最佳实践
# 不要硬写1，多核pod会浪费算力
worker_processes  auto;

# 全局错误日志：路径、日志级别 warn（只记录warn及以上：warn/error/crit）
# 可选级别：debug > info > notice > warn > error > crit
error_log  /var/log/nginx/error.log warn;

# pid文件，记录nginx主进程ID，用于管理进程启停
pid        /var/run/nginx.pid;

# events模块：控制网络连接相关参数
events {
    # 单个worker进程最大并发连接数
    # 容器场景1024够用，前端静态站足够；如果并发很高可以调到2048
    worker_connections  1024;
}

# http模块：所有http服务全局配置
http {
    # 引入mime类型文件，告诉nginx不同后缀文件对应的Content-Type
    include       /etc/nginx/mime.types;
    # 未识别后缀的文件，默认二进制流下载
    default_type  application/octet-stream;

    # 关闭nginx版本号泄露，响应头不显示nginx版本，安全加固
    server_tokens off;

    # ========== 重要提醒 ==========
    # http块下的add_header不会自动继承到server/location，写在这里无效！
    # 安全头全部迁移到 conf.d/default.conf 的 server{} 内，不要放在这里
    # add_header X-Frame-Options DENY;
    # add_header X-XSS-Protection "1; mode=block";
    # add_header Content-Security-Policy "frame-ancestors none;";
    # more_set_headers "Server: CTX"; # 需要第三方模块，官方nginx不支持，注释

    # 自定义访问日志格式，命名为main
    # $remote_addr 客户端IP | $remote_user 认证用户 | $time_local 请求时间
    # $request 请求行 | $status http状态码 | $body_bytes_sent 返回字节
    # $http_referer 来源页 | $http_user_agent 浏览器UA | $http_x_forwarded_for 代理传递IP
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 开启访问日志，使用上面定义的main格式
    access_log  /var/log/nginx/access.log  main;

    # 开启sendfile，利用操作系统零拷贝，静态文件传输性能大幅提升，静态站点必开
    sendfile        on;
    # tcp_nopush：sendfile配套，减少小包，提升网络吞吐，sendfile on时推荐开启
    tcp_nopush     on;

    # keepalive长连接超时：65秒，连接空闲超过这个时间断开
    keepalive_timeout  65;

    # ========== Gzip压缩（前端Vue静态资源强烈推荐开启） ==========
    gzip  on;
    # 最小压缩文件大小，小于1k不压缩，避免小文件压缩开销
    gzip_min_length 1k;
    # 压缩级别1~9，6是性能和压缩率平衡点，越高越耗CPU
    gzip_comp_level 6;
    # 需要压缩的MIME类型，js/css/html/svg等前端资源
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    # 对代理返回的内容也开启gzip（api代理场景）
    gzip_proxied any;
    # 给压缩后的响应添加Vary头，兼容代理缓存
    gzip_vary on;

    # 缓存打开的文件描述符，减少磁盘IO，静态站点优化
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    # 引入conf.d目录下所有.conf文件，加载我们的default.conf站点配置
    include /etc/nginx/conf.d/*.conf;
}