# 虚拟主机配置块，定义一个网站服务
server {
    # 监听容器内 9301端口
    listen       3030;
    # 匹配请求host，这里localhost，在k8s内部无所谓，域名由上层Ingress控制
    server_name  localhost;

    # ================== 安全HTTP响应头（全局，整个server生效，不用在location重复写） ==================
    # 禁止页面被iframe嵌入，防止点击劫持
    add_header X-Frame-Options DENY;
    # 开启浏览器XSS防护
    add_header X-XSS-Protection "1; mode=block";
    # CSP：禁止页面被别的框架嵌入，只限制frame-ancestors，最小粒度
    add_header Content-Security-Policy "frame-ancestors none;";
    # 禁止浏览器猜测资源MIME类型，防止MIME类型嗅探攻击
    add_header X-Content-Type-Options nosniff;

    # 【重要提示】如果你是AWS EKS + ALB Ingress在外部做HTTPS，容器内是http，注释掉下面HSTS！
    # HSTS：强制浏览器使用HTTPS一年，仅当nginx直接对外443时启用；ALB终止ssl时不要在这里配置
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ================== 静态资源根路径与首页 ==================
    location / {
        # 静态文件存放目录，对应Docker镜像内打包的vue产物dist
        root   /usr/share/nginx/web;
        # 默认首页文件，先找index.html
        index  index.html index.htm;

        # 针对SPA入口index.html：不缓存，每次请求校验更新
        # 只对index.html生效，下面单独给js/css/img做长缓存
        location ~* ^/index\.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # 打包后带hash后缀的静态资源（js/css/svg/png/woff等），设置长期缓存
        # 文件名带hash，文件变更hash自动变，缓存安全
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y; # 缓存一年
            add_header Cache-Control "public, immutable";
        }

        # Vue history模式核心：404全部返回index.html，交给前端路由接管
        try_files $uri $uri/ /index.html;
    }

    # 5xx服务错误页面，返回50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/web;
    }

    # ================== API反向代理，转发请求到后端SpringBoot服务 ==================
    # 匹配 /api/ 开头的请求
    location /api/ {
        # 代理转发到k8s内service: ctx-user-web，端口3030
        # 末尾带/：/api/xxx → http://hy-vue3-demo:3030/xxx（剥离/api前缀）
        proxy_pass   http://hy-vue3-demo:3030/;
        # 关闭自动重写redirect的host，让后端返回原始地址
        proxy_redirect     off;

        # 【推荐补充】代理基础头，后端可以拿到真实客户端IP，不加后端拿到的都是pod ip
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 屏蔽访问 .ht 隐藏文件，安全加固
    location ~ /\.ht {
        deny  all;
    }
}